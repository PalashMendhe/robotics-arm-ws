services:

  sim:
    build: .
    image: robotic_arm:lyrical
    container_name: arm_sim
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - GZ_SIM_SYSTEM_PLUGIN_PATH=/opt/ros/lyrical/lib
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    privileged: true
    command: >
      ros2 launch arm_moveit_config moveit.launch.py

  run:
    build: .
    image: robotic_arm:lyrical
    container_name: arm_run
    depends_on:
      - sim
    command: >
      bash -c "sleep 10 &&
               ros2 run robotic_4dof_arm pick_and_place.py"

  # Phase 3 §3.2 — COOL inspection backend (AWS Graviton / linux/arm64).
  # Edge keeps robot control + video; this serves ROI profiling + S3 ledger.
  cool:
    build:
      context: .
      dockerfile: Dockerfile.cool
    image: activeinspect-cool:arm64
    platform: linux/arm64
    container_name: activeinspect_cool
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - COOL_KLEIDICV=1